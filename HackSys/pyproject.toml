[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacksys"
version = "0.1.0"
description = "HackProof system-plane agent: tamper-evident local activity monitoring for hackathons"
requires-python = ">=3.9"
dependencies = [
    "watchdog>=4.0",
]

[project.scripts]
hacksys = "hacksys.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["hacksys*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
